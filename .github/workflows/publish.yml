# On every push to main: build, push and sign the bundles whose sources
# changed, run their fixtures in the cluster (real runner image, gVisor),
# attest and sign them as tested, then publish every agent's manifests as one
# signed OCI artifact for Flux. No laptop and no stored credentials:
#   - the tailnet: Tailscale workload identity federation (vars.TS_CLIENT_ID,
#     vars.TS_AUDIENCE), node tag tag:tap-ci;
#   - OpenBao (Transit signing, zot password, a short-lived Kubernetes token):
#     GitHub's OIDC token, roles tap-ci-build and tap-ci-tested, bound to this
#     workflow on main. Only the test job, in environment "tested", can sign as
#     tested. Set up by tap's `task ci:onboard`.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  VAULT_ADDR: https://openbao.alacasa.uk:8443
  TRANSIT_SECRET_ENGINE_PATH: tap-transit
  REGISTRY: registry.hiddenfield.dev
  COSIGN_VERSION: v2.5.3 # same as tap's `task tools`

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      agents: ${{ steps.plan.outputs.agents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tap-ci
          args: --accept-routes
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: tap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-tap.sh
      - id: plan
        run: ci/plan.sh >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.agents != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tap-ci
          args: --accept-routes
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: tap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-tap.sh
      - name: push and sign as built
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          . ci/lib.sh
          bao_login tap-ci-build
          registry_login
          pubkeys
          # Under metadata.version: pushing different content under an
          # existing version fails, so a change without a bump stops here.
          ref=$("$TAPCTL" bundle build --platform "$PLATFORM" --push "agents/$AGENT")
          sign_once "$ref" tap-build

  test:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: tested
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the attestation's permission diff reads the previous main
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tap-ci
          args: --accept-routes
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: tap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-tap.sh
      - name: fixtures in tap-ci, attest, sign as tested
        env:
          AGENT: ${{ matrix.agent }}
          BEFORE: ${{ github.event.before }}
        run: |
          . ci/lib.sh
          bao_login tap-ci-tested
          registry_login
          kube_login
          # The previous main, or none for the first push.
          base=""
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null && base="git:$BEFORE"
          ci/test-agent.sh "$AGENT" "$base"

  publish:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tap-ci
          args: --accept-routes
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
      - name: tap release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./fetch-tap.sh
      - name: render and publish signed manifests
        run: |
          . ci/lib.sh
          bao_login tap-ci-build
          registry_login
          ci/publish.sh
