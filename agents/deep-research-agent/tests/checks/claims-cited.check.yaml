check: claims-cited
cases:
  - name: every statement cited, every source used
    task: How many people live in Paris?
    output: |
      # Population of Paris

      The City of Paris had an estimated 2,102,650 residents in January 2023 [1].
      The wider Paris region is home to about 12 million people [2].

      ## Sources

      1. Paris - Wikipedia — https://en.wikipedia.org/wiki/Paris
      2. Île-de-France - Wikipedia — https://en.wikipedia.org/wiki/%C3%8Ele-de-France
    expect: { pass: true }
  - name: citation after the full stop counts
    task: q
    output: |
      # T

      Paris is the capital of France. [1]

      ## Sources

      1. Paris — https://en.wikipedia.org/wiki/Paris
    expect: { pass: true }
  - name: a Note about what could not be found needs no citation
    task: q
    output: |
      # T

      Paris is the capital of France [1].

      > Note: I could not find a working source for the 2019 population.

      ## Sources

      1. Paris — https://en.wikipedia.org/wiki/Paris
    expect: { pass: true }
  - name: an abbreviation is not the end of a sentence (live report, 2026-11-03)
    task: What is the population of the City of Paris according to the latest INSEE estimate?
    output: |
      # Population of Paris

      The 2023 vintage was published on 29 December 2025 and entered into force on 1 January 2026, authenticated by decree no. 2025-1362 of 26 December 2025 [1]. It is the latest entry in the published series of reference populations, e.g. Paris and Lyon, as in Dupont et al. 2024 [1]. The U.S. Census Bureau publishes similar figures for American cities [1].

      ## Sources

      1. Populations de référence 2023 − Commune de Paris (75056) — https://www.insee.fr/fr/statistiques/8643952?geo=COM-75056
    expect: { pass: true, reason: "^3 statements, all cited" }
  - name: a lead-in to a list needs no citation, its items do
    task: q
    output: |
      # T

      Comparing the two reference populations:

      - Paris had 2,243,833 inhabitants at 1 January 2010 [1].
      - Paris had 2,103,778 inhabitants at 1 January 2023 [2].

      ## Sources

      1. Populations légales 2010 — https://www.insee.fr/fr/statistiques/2128779?sommaire=2128804
      2. Populations de référence 2023 — https://www.insee.fr/fr/statistiques/8643952?geo=COM-75056
    expect: { pass: true }
  - name: a real sentence end after a number still splits
    task: q
    output: |
      # T

      Paris had 2,103,778 inhabitants in 2023 [1]. The decline is driven by migration, not by deaths exceeding births.

      ## Sources

      1. Paris — https://www.insee.fr/fr/statistiques/8643952?geo=COM-75056
    expect: { pass: false, reason: "^1 of 2 statements has no citation" }
  - name: an uncited statement fails and is named
    task: How many people live in Paris?
    output: |
      # Population of Paris

      The City of Paris had an estimated 2,102,650 residents in January 2023 [1].
      It is the most densely populated city in Europe.

      ## Sources

      1. Paris - Wikipedia — https://en.wikipedia.org/wiki/Paris
    expect: { pass: false, reason: "^1 of 2 statements has no citation" }
  - name: a citation missing from Sources fails
    task: q
    output: |
      # T

      Paris is the capital of France [1]. The Seine flows through Paris [4].

      ## Sources

      1. Paris — https://en.wikipedia.org/wiki/Paris
    expect: { pass: false, reason: "cites \\[4\\] but Sources does not list it" }
  - name: no Sources section fails
    task: q
    output: Paris is the capital of France [1].
    expect: { pass: false, reason: "no \"## Sources\" section" }
