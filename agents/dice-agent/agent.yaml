apiVersion: tavon.ai/agent/v1
kind: Agent
metadata:
  name: dice-agent
  version: 0.1.0
  owner: "platform"
  description: "Roll dice for tabletop games using standard dice notation like 2d6 or 1d20+5."

harness:
  api: v1
  model:
    provider: gateway
    name: agent
  maxTurns: 12

# No write tools, so deny is safe.
effectsPolicy:
  write: deny
  irreversible: deny

prompt: system.md
skills:
  - skills/dice

runner:
  image: registry.hiddenfield.dev/tap/runner-python@sha256:8130e0af03b67f8baec8c6c96c6f44eb0558d3b745ee459ba1c7ea3780280d65
  timeout: 15s
  resources: { cpu: 250m, memory: 128Mi }

tools:
  - name: roll_dice
    description: >-
      Parse a dice notation string (like "2d6", "1d20+5" or "4d8-2"),
      validate it, roll that many dice with that many sides, and return
      each roll, the modifier and the total.
    input_schema:
      type: object
      properties:
        notation:
          type: string
          description: >-
            Dice notation: count (1-100), letter d, sides (2-1000), and an
            optional +/- modifier (up to 1000). Examples: "2d6", "1d20+5", "4d8-2".
          pattern: "^[1-9]\\d{0,2}d[1-9]\\d{0,3}([+-][1-9]\\d{0,3})?$"
      required: [notation]
      additionalProperties: false
    exec: ["python3", "tools/roll_dice.py", "--notation", "{{notation}}"]
    effects: read

workspace:
  size: 64Mi