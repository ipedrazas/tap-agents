tool: roll_dice
cases:
  - name: basic roll 2d6
    args: { notation: "2d6" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [rolls, modifier, total]
        properties:
          rolls:
            type: array
            items: { type: integer, minimum: 1, maximum: 6 }
            minItems: 2
            maxItems: 2
          modifier: { type: integer, const: 0 }
          total:
            type: integer
            minimum: 2
            maximum: 12

  - name: roll with positive modifier 1d20+5
    args: { notation: "1d20+5" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [rolls, modifier, total]
        properties:
          rolls:
            type: array
            items: { type: integer, minimum: 1, maximum: 20 }
            minItems: 1
            maxItems: 1
          modifier: { type: integer, const: 5 }
          total:
            type: integer
            minimum: 6
            maximum: 25

  - name: roll with negative modifier 4d8-2
    args: { notation: "4d8-2" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [rolls, modifier, total]
        properties:
          rolls:
            type: array
            items: { type: integer, minimum: 1, maximum: 8 }
            minItems: 4
            maxItems: 4
          modifier: { type: integer, const: -2 }
          total:
            type: integer
            minimum: 2
            maximum: 30

  - name: sides out of range 1d1
    args: { notation: "1d1" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [error]
        properties:
          error: { type: string, const: invalid_sides }
          message: { type: string }

  - name: count out of range 101d6
    args: { notation: "101d6" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [error]
        properties:
          error: { type: string, const: invalid_count }
          message: { type: string }

  - name: modifier out of range 1d6+1001
    args: { notation: "1d6+1001" }
    expect:
      ok: true
      output_schema:
        type: object
        required: [error]
        properties:
          error: { type: string, const: invalid_modifier }
          message: { type: string }

  - name: notation argument is required
    args: {}
    expect:
      ok: false
      error_kind: invalid_args