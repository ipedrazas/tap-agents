e the job's OIDC token for an OpenBao token and\"},{\"n\":11,\"text\":\"# export it (masked) to this and later steps as VAULT_TOKEN.\"},{\"n\":12,\"text\":\"bao_login() {\"},{\"n\":13,\"text\":\"  jwt=$(curl -sSf -H \\\"Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN\\\" \\\"$ACTIONS_ID_TOKEN_REQUEST_URL\\u0026audience=openbao\\\" | jq -r .value)\"},{\"n\":14,\"text\":\"  VAULT_TOKEN=$(jq -n --arg role \\\"$1\\\" --arg jwt \\\"$jwt\\\" '{role: $role, jwt: $jwt}' \\\\\"},{\"n\":15,\"text\":\"    | curl -sSf -X POST --data @- \\\"$VAULT_ADDR/v1/auth/jwt-github/login\\\" | jq -r .auth.client_token)\"},{\"n\":16,\"text\":\"  [ -n \\\"$VAULT_TOKEN\\\" ] \\u0026\\u0026 [ \\\"$VAULT_TOKEN\\\" != null ] || { echo \\\"::error::OpenBao login as $1 failed\\\"; return 1; }\"},{\"n\":17,\"text\":\"  echo \\\"::add-mask::$VAULT_TOKEN\\\"\"},{\"n\":18,\"text\":\"  export VAULT_TOKEN\"},{\"n\":19,\"text\":\"  [ -z \\\"${GITHUB_ENV:-}\\\" ] || echo \\\"VAULT_TOKEN=$VAULT_TOKEN\\\" \\u003e\\u003e \\\"$GITHUB_ENV\\\"\"},{\"n\":20,\"text\":\"}\"},{\"n\":21,\"text\":\"\"},{\"n\":22,\"text\":\"bao_get() { # \\u003cpath under secret/\\u003e \\u003cfield\\u003e\"},{\"n\":23,\"text\":\"  curl -sSf -H \\\"X-Vault-Token: $VAULT_TOKEN\\\" \\\"$VAULT_ADDR/v1/secret/data/$1\\\" | jq -r \\\".data.data[\\\\\\\"$2\\\\\\\"]\\\"\"},{\"n\":24,\"text\":\"}\"},{\"n\":25,\"text\":\"\"},{\"n\":26,\"text\":\"# registry_login: the tap-platform-ci push user, for docker, crane and cosign\"},{\"n\":27,\"text\":\"# (all read the Docker config).\"},{\"n\":28,\"text\":\"registry_login() {\"},{\"n\":29,\"text\":\"  pw=$(bao_get tap-platform-ci/zot password)\"},{\"n\":30,\"text\":\"  echo \\\"::add-mask::$pw\\\"\"},{\"n\":31,\"text\":\"  printf '%s' \\\"$pw\\\" | docker login \\\"$REGISTRY\\\" -u \\\"$(bao_get tap-platform-ci/zot username)\\\" --password-stdin \\u003e/dev/null\"},{\"n\":32,\"text\":\"}\"},{\"n\":33,\"text\":\"\"},{\"n\":34,\"text\":\"# pubkey: the build key admission and Flux trust, from platform.yaml.\"},{\"n\":35,\"text\":\"pubkey() {\"},{\"n\":36,\"text\":\"  mkdir -p .tap\"},{\"n\":37,\"text\":\"  go run ./c...[trimmed for the fixture]", "status": "ok", "latency_ms": 443}}, {"step_id": "t0.s6", "step_index": 6, "kind": "tool_call", "start_time": "2026-10-16T12:39:42.28157067Z", "end_time": "2026-10-16T12:39:42.663103835Z", "tool_call": {"call_id": "call_708126013d164158987736d1", "name": "get_file", "arguments": {"owner": "ipedrazas", "repo": "tap", "path": "deploy/apps.sh", "ref": "2ddb9a9c0ad92b2fcb165521ef881373780059b2", "start_line": 1, "end_line": 100}, "result": "{\"lines\":[{\"n\":1,\"text\":\"#!/usr/bin/env bash\"},{\"n\":2,\"text\":\"# The apps layer of the platform: the services in deploy/platform/apps and\"},{\"n\":3,\"text\":\"# deploy/factory/apps, whose images git names without a digest.\"},{\"n\":4,\"text\":\"#\"},{\"n\":5,\"text\":\"#   apps.sh images        the images in the apps layer\"},{\"n\":6,\"text\":\"#   apps.sh inputs IMAGE  the paths IMAGE's build reads\"},{\"n\":7,\"text\":\"#   apps.sh tag IMAGE     IMAGE's input tag: the first 12 characters of the\"},{\"n\":8,\"text\":\"#                         last commit that touched its inputs, with -dirty if\"},{\"n\":9,\"text\":\"#                         the working tree changes them. Exits 1 for images\"},{\"n\":10,\"text\":\"#                         outside the apps layer.\"},{\"n\":11,\"text\":\"#   apps.sh refs          every image at its input tag, as name@digest\"},{\"n\":12,\"text\":\"#   apps.sh render        the apps layer with those digests, on stdout\"},{\"n\":13,\"text\":\"#\"},{\"n\":14,\"text\":\"# Images are pushed under their input tag (task images:push), so a commit that\"},{\"n\":15,\"text\":\"# doesn't touch an image's inputs reuses the image already in the registry,\"},{\"n\":16,\"text\":\"# and the same sources always render the same digest.\"},{\"n\":17,\"text\":\"set -euo pipefail\"},{\"n\":18,\"text\":\"cd \\\"$(dirname \\\"$0\\\")/..\\\"\"},{\"n\":19,\"text\":\"\"},{\"n\":20,\"text\":\"REGISTRY=${REGISTRY:-registry.hiddenfield.dev}\"},{\"n\":21,\"text\":\"IMAGES=\\\"console hooks egress-proxy factory factory-publisher\\\"\"},{\"n\":22,\"text\":\"\"},{\"n\":23,\"text\":\"# inputs IMAGE: the paths its build reads. Go images: the module's packages\"},{\"n\":24,\"text\":\"# the binaries import (embedded files included), go.mod, go.sum and the\"},{\"n\":25,\"text\":\"# image's own directory.\"},{\"n\":26,\"text\":\"inputs() {\"},{\"n\":27,\"text\":\"  local pkgs extra=\\\"\\\"\"},{\"n\":28,\"text\":\"  case $1 in\"},{\"n\":29,\"text\":\"    console | hooks | egress-proxy | factory-publisher) pkgs=./cmd/$1 ;;\"},{\"n\":30,\"text\":\"    factory) pkgs=\\\"./cmd/tapctl ./cmd/runner\\\" extra=\\\"factory/package.json factory/package-lock.json factory/src\\\" ;;\"},{\"n\":31,\"text\":\"    *) return 1 ;;\"},{\"n\":32,\"text\":\"  esac\"},{\"n\":33,\"text\":\"  # shellcheck disable=SC2086\"},{\"n\":34,\"text\":\"  go list -deps -f '{{if .Module}}{{if .Module.Main}}{{.Dir}}{{end}}{{end}}' $pkgs | sed \\\"s#^$PWD/##\\\" | sort -u\"},{\"n\":35,\"text\":\"  # shellcheck disable=SC2086\"},{\"n\":36,\"text\":\"  echo go.mod go.sum \\\"images/$1\\\" $extra | tr ' ' '\\\\n'\"},{\"n\":37,\"text\":\"}\"},{\"n\":38,\"text\":\"\"},{\"n\":39,\"text\":\"tag() {\"},{\"n\":40,\"text\":\"  local paths commit\"},{\"n\":41,\"tex...[trimmed for the fixture]", "status": "ok", "latency_ms": 381}}, {"step_id": "t0.s7", "step_index": 7, "kind": "llm_call", "start_time": "2026-10-16T12:39:42.663121525Z", "end_time": "2026-10-16T12:40:07.962146501Z", "llm_call": {"provider": "gateway", "model": "deepseek/deepseek-v4-flash", "response_model": "deepseek/deepseek-v4-flash", "stop_reason": "tool_calls", "tokens": {"input": 3369, "output": 1147, "cache_read": 8192, "cache_write": 0, "reasoning": 991}, "latency_ms": 25299, "context_used": 12708, "tool_call_ids": ["t0.s8"]}}, {"step_id": "t0.s8", "step_index": 8, "kind": "tool_call", "start_time": "2026-10-