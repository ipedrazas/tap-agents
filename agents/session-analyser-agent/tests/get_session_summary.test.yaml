it — implementing Phase 3 of `docs/platform-gitops-plan.md`. The code is well-structured with proper error handling (`set -euo pipefail`, digest validation, `case` guard on `jq` output), safe credential scoping (Tailscale OIDC, OpenBao, no stored secrets), and the dependency chain (`needs: build` waits for the full matrix) is correct. I checked `ci/lib.sh` (`verified`, `sign_once`, `pubkey`) and `deploy/apps.sh` (`refs`, `render`) in full: all functions used by the new code are consistent and handle their edge cases.\n\n**Coverage:**\n- Files reviewed: `.github/workflows/platform.yml`, `ci/publish.sh`, `docs/platform-gitops-plan.md` (all via diff), plus `ci/lib.sh` and `deploy/apps.sh` (full file context).\n- No files skipped or truncated."}}]}]}
