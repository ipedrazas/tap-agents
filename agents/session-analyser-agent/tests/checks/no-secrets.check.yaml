check: no-secrets
cases:
  - name: a described token passes
    task: Look at gh-pr-agent/0067f3361df88a417c66fc17e06272db.trace.json
    output: |
      gh-pr-agent 0.3.6, chat, 1 turn: 1 finding

      **[instructions] a GitHub token in the arguments of t0.s4**
      The model passed a token as a tool argument. Contact: noreply@example.com, git@github.com.
      Not filed: not asked to.
    expect: { pass: true }
  - name: a quoted GitHub token fails without repeating it
    task: q
    output: |
      gh-pr-agent 0.3.6, chat, 1 turn: 1 finding

      **[instructions] token in arguments** t0.s4 passed `ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa`.
    expect: { pass: false, reason: "1 credential or address \\(GitHub token\\)" }
  - name: an AWS key and a customer email fail
    task: q
    output: |
      Nothing worth filing. The prompt at t0.s0 came from jane.doe@acme-corp.io and used AKIAIOSFODNN7EXAMPLE.
    expect: { pass: false, reason: "AWS access key id, email address" }
